<!doctype html>
<html lang="es-VE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista previa · Página principal LottoGE</title>
<style>
  :root { --bg: #f1f0ec; --ink: #1d2340; --muted: #5b6078; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Arial, sans-serif; }
  header { padding: 24px 32px 8px; }
  h1 { margin: 0; font-size: 1.375rem; }
  header p { margin: 6px 0 0; color: var(--muted); }
  header a { color: inherit; font-weight: 600; }
  .stage { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; justify-content: center; padding: 24px 32px 48px; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
  figcaption { color: var(--muted); font-size: 0.9375rem; }
  /* Computadora: la página a 1440 px, reducida */
  .desk { width: 864px; height: 540px; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 0 #d9d7d0, 0 18px 40px rgba(29, 35, 64, .12); }
  .desk iframe { width: 1440px; height: 900px; border: 0; transform: scale(.6); transform-origin: 0 0; }
  /* Teléfono */
  .phone { width: 410px; height: 864px; border-radius: 54px; background: #1d2340; padding: 10px; box-shadow: 0 18px 40px rgba(29, 35, 64, .18); }
  .phone iframe { width: 390px; height: 844px; border: 0; border-radius: 44px; background: #fff; }
  @media (max-width: 960px) { .desk { width: 100%; max-width: 864px; } }
</style>
</head>
<body>
  <header>
    <h1>Página principal de LottoGE · propuesta sencilla</h1>
    <p>La misma página en computadora y en teléfono. Para verla a pantalla completa abre <a href="../front/index.html">front/index.html</a>.</p>
  </header>
  <div class="stage">
    <figure>
      <div class="desk"><iframe src="../front/index.html" title="Página principal en computadora"></iframe></div>
      <figcaption>Computadora (1440 px)</figcaption>
    </figure>
    <figure>
      <div class="phone"><iframe src="../front/index.html" title="Página principal en teléfono"></iframe></div>
      <figcaption>Teléfono (390 px)</figcaption>
    </figure>
  </div>
</body>
</html>

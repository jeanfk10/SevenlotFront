<!doctype html>
<html lang="es-VE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifa · LottoGE</title>
<meta name="description" content="Compra de boletos de la rifa, sobre la plataforma LottoGE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* Layout: a neutral platform shell that steps back so each rifero's flyer and brand colour carry the page.
   The whole purchase happens inside one box on the landing: tickets, then buyer data, then payment, in the same place. */
:root, .force-light {
  --bg: #f3f4f2;
  --surface: #e7e9e6;
  --surface-2: #d9dcd8;
  --ink: #111312;
  --muted: #535855;
  --good: #137a47;
  --good-ink: #ffffff;
  --wait: #9a5b00;
  --danger: #b3261e;
  --accent: #e9b227;
  --accent-ink: #17130a;
  --scrim: rgba(10, 12, 11, .55);
  --titanium: #5a605d;
  --bezel: #050606;
  --island: #000000;
  --on-island: #ffffff;
  --font: "TikTok Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f0f; --surface: #1a1c1b; --surface-2: #272a29; --ink: #edeeec; --muted: #a0a5a2;
    --good: #6fd19c; --good-ink: #08170f; --wait: #f2b552; --danger: #ff8f80; --scrim: rgba(0, 0, 0, .7); --titanium: #3d4341;
    color-scheme: dark;
  }
}
:root[data-theme="dark"], .force-dark {
  --bg: #0e0f0f; --surface: #1a1c1b; --surface-2: #272a29; --ink: #edeeec; --muted: #a0a5a2;
  --good: #6fd19c; --good-ink: #08170f; --wait: #f2b552; --danger: #ff8f80; --scrim: rgba(0, 0, 0, .7); --titanium: #3d4341;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wide { font-weight: 800; font-stretch: 150%; text-transform: uppercase; letter-spacing: -0.01em; line-height: .92; }

/* ---------- Showcase ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { padding-block: 28px 64px; display: grid; gap: 26px; }
.top__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.lgmark { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-stretch: 150%; font-size: 21px; }
.lgmark b { font-weight: inherit; }
.lgmark i { width: 26px; height: 26px; background: currentColor; display: block; clip-path: polygon(0 0, 100% 0, 100% 62%, 62% 100%, 0 100%); }
.themebtn { border: 0; background: var(--surface); padding: 10px 16px; font-size: 15px; font-weight: 500; display: inline-flex; gap: 10px; align-items: center; transition: background .2s, transform .15s; }
.themebtn:hover { background: var(--surface-2); }
.themebtn:active { transform: scale(.97); }
.top h1 { margin: 22px 0 0; font-size: clamp(46px, 9.4vw, 150px); max-width: 12ch; text-wrap: balance; }
.top__row { display: grid; gap: 18px; }
.top__lede { margin: 0; font-size: clamp(18px, 1.2vw + 12px, 24px); line-height: 1.4; max-width: 50ch; }
.top__note { margin: 0; color: var(--muted); }
@media (min-width: 900px) { .top__row { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: end; } .top__note { text-align: right; } }

.cfg { background: var(--surface); padding-block: 40px 44px; margin-bottom: 120px; }
.cfg__in { display: grid; gap: 32px; }
@media (min-width: 1000px) { .cfg__in { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); } }
.cfg h2, .group__head h2 { margin: 0; font-size: clamp(30px, 3vw + 10px, 52px); line-height: 1.02; letter-spacing: -0.02em; font-weight: 800; font-stretch: 125%; text-wrap: balance; }
.cfg__intro p { margin: 14px 0 0; font-size: 18px; max-width: 40ch; }
.cfg__intro .top__note { font-size: 15px; }
.cfg form { display: grid; gap: 28px 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .cfg form { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; align-content: start; min-width: 0; }
legend { padding: 0; margin-bottom: 4px; font-size: 18px; font-weight: 700; }
.f { display: grid; gap: 6px; min-width: 0; }
.f label, .f > span { font-size: 14px; font-weight: 600; }
.f2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.in { width: 100%; min-height: 48px; border: 2px solid var(--surface-2); background: var(--bg); padding: 0 12px; font-size: 16px; border-radius: 0; appearance: none; transition: border-color .2s; }
.in:focus { outline: none; border-color: var(--ink); }
.in.is-bad { border-color: var(--danger); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span { display: grid; place-items: center; min-width: 76px; min-height: 44px; padding: 0 12px; font-size: 14px; font-weight: 700; background: var(--c); color: var(--ci); transition: transform .15s; }
.sw input:checked + span { outline: 3px solid var(--ink); outline-offset: 3px; }
.sw input:focus-visible + span { outline: 3px dashed var(--ink); outline-offset: 3px; }
.sw:active span { transform: scale(.96); }
.imgrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.thumbs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs li { position: relative; }
.thumbs img { width: 64px; height: 64px; object-fit: cover; object-position: top; display: block; background: var(--surface-2); }
.thumbs button { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border: 0; background: var(--ink); color: var(--bg); font-size: 16px; line-height: 1; }
.thumbs small { position: absolute; left: 0; bottom: 0; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 700; padding: 1px 5px; }
.f > span small { font-weight: 400; color: var(--muted); }
.pbtn { border: 0; min-height: 44px; padding: 0 14px; font-weight: 700; font-size: 15px; background: var(--ink); color: var(--bg); transition: transform .15s, opacity .2s; display: inline-flex; align-items: center; cursor: pointer; }
.pbtn:hover { opacity: .85; }
.pbtn:active { transform: scale(.97); }
.pbtn--ghost { background: var(--bg); color: var(--ink); }
.cfg__err { margin: 0; color: var(--danger); font-size: 14px; }
.cfg__foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cfg__foot p { margin: 0; font-size: 14px; color: var(--muted); }

.group { padding-block: 0 140px; }
.group__head { display: grid; gap: 12px; margin-bottom: 44px; }
.group__head p { margin: 0; max-width: 62ch; font-size: 18px; }
.gallery { display: flex; flex-wrap: wrap; gap: 64px 48px; }
.device { margin: 0; display: grid; gap: 18px; width: min-content; }
.device figcaption { display: grid; gap: 6px; }
.device h3 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 600; }
.device figcaption p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.reset { justify-self: start; margin-top: 6px; border: 0; background: none; padding: 6px 0; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.reset:hover { text-decoration-thickness: 2px; }
.foot { padding-block: 0 72px; display: grid; gap: 12px; color: var(--muted); font-size: 15px; max-width: 80ch; }
.foot p { margin: 0; }
.foot strong { color: var(--ink); }

/* ---------- iPhone ---------- */
.frame { zoom: var(--z, .8); width: 417px; height: 876px; flex: none; border-radius: 68px; background: var(--titanium); padding: 4px; position: relative; }
.frame::before, .frame::after { content: ""; position: absolute; background: var(--titanium); width: 4px; border-radius: 2px; }
.frame::before { left: -4px; top: 190px; height: 64px; }
.frame::after { right: -4px; top: 250px; height: 100px; }
.bezel { width: 100%; height: 100%; border-radius: 64px; background: var(--bezel); padding: 8px; }
.screen { position: relative; width: 393px; height: 852px; border-radius: 56px; overflow: hidden; background: var(--bg); color: var(--ink); isolation: isolate; font-size: 16px; line-height: 1.45; }

/* ---------- Mac (the same screens on a computer) ---------- */
:root { --alu-1: #e4e5e7; --alu-2: #a9abaf; --alu-edge: #3b3c3f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --alu-1: #8e9095; --alu-2: #55575c; } }
:root[data-theme="dark"] { --alu-1: #8e9095; --alu-2: #55575c; }
.mbar { display: none; }
[data-device="mac"] .gallery { gap: 72px 48px; }
[data-device="mac"] .frame { width: 1340px; height: auto; border-radius: 0; background: none; padding: 0 0 24px; }
[data-device="mac"] .frame::before { left: 50%; top: auto; bottom: 14px; width: 180px; height: 10px; margin-left: -90px; border-radius: 0 0 10px 10px; background: var(--alu-2); z-index: 1; }
[data-device="mac"] .frame::after { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 24px; border-radius: 3px 3px 22px 22px / 3px 3px 14px 14px; background: linear-gradient(var(--alu-1), var(--alu-2)); }
[data-device="mac"] .bezel { position: relative; width: 1304px; height: auto; margin: 0 auto; border-radius: 26px 26px 6px 6px; padding: 12px 12px 18px; background: var(--bezel); box-shadow: inset 0 0 0 2px var(--alu-edge); }
[data-device="mac"] .bezel::before { content: ""; position: absolute; z-index: 3; top: 12px; left: 50%; width: 176px; height: 26px; margin-left: -88px; border-radius: 0 0 12px 12px; background: var(--bezel); }
[data-device="mac"] .screen { width: 1280px; height: 760px; border-radius: 0 0 4px 4px; }
[data-device="mac"] .mbar { display: block; width: 1280px; background: var(--bg); color: var(--ink); font: 13px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; border-radius: 8px 8px 0 0; overflow: hidden; }
.mbar__menu { height: 26px; display: flex; align-items: center; gap: 20px; padding: 0 18px; background: var(--surface-2); }
.mbar__menu b { font-weight: 700; }
.mbar__menu time { margin-left: auto; font-variant-numeric: tabular-nums; }
.mbar__tool { height: 46px; display: grid; grid-template-columns: 120px 60px minmax(0, 1fr) 180px; align-items: center; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--surface-2); }
.mbar__dots { display: flex; gap: 8px; }
.mbar__dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.mbar__dots i:nth-child(2) { background: #febc2e; }
.mbar__dots i:nth-child(3) { background: #28c840; }
.mbar__arrows { color: var(--muted); font-size: 22px; line-height: 1; }
.mbar__url { justify-self: center; width: min(540px, 100%); height: 30px; border-radius: 8px; background: var(--bg); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
.mbar__url svg { width: 12px; height: 12px; }
.devsw { position: fixed; z-index: 100; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; background: var(--ink); color: var(--bg); border-radius: 999px; box-shadow: 0 10px 30px rgba(0, 0, 0, .28); }
.devsw__lbl { padding: 0 8px 0 12px; font-size: 14px; font-weight: 600; opacity: .7; }
.devsw button { border: 0; background: none; color: inherit; min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; transition: background .2s, color .2s; }
.devsw button svg { width: 18px; height: 18px; }
.devsw button[aria-checked="true"] { background: var(--bg); color: var(--ink); }
.devsw button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { padding-bottom: 120px; }

/* ---------- page parts that only a computer shows ---------- */
.nav .nav__links, .nav .nav__buy { display: none; }
.nav__links button { border: 0; background: none; min-height: 40px; padding: 0 12px; font-size: 15px; font-weight: 600; color: var(--muted); transition: color .2s; }
.nav__links button:hover { color: var(--ink); }

/* ---------- App shell ---------- */
.app { position: absolute; inset: 0; }
.island { position: absolute; z-index: 80; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: var(--island); }
.sbar { position: absolute; z-index: 70; inset: 0 0 auto; height: 54px; padding: 18px 30px 0 46px; display: flex; justify-content: space-between; align-items: flex-start; background: var(--bg); color: var(--ink); font-weight: 600; font-size: 17px; line-height: 1; }
.sbar__icons { display: flex; gap: 6px; align-items: center; padding-top: 1px; }
.sbar svg { display: block; fill: currentColor; }
.app.is-dark-top .sbar { background: var(--island); color: var(--on-island); }
.homebar { position: absolute; z-index: 90; bottom: 8px; left: 50%; width: 136px; margin-left: -68px; height: 5px; border-radius: 3px; background: var(--ink); pointer-events: none; }
.view { position: absolute; inset: 0; }
.scroller { position: absolute; inset: 54px 0 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }

.btn { border: 0; border-radius: 0; min-height: 56px; padding: 0 22px; font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s ease, background .2s ease, color .2s ease, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn--accent { background: var(--accent); color: var(--accent-ink); }
.btn--accent:hover { opacity: .88; }
.btn--ink { background: var(--ink); color: var(--bg); }
.btn--ink:hover { opacity: .85; }
.btn--ghost { background: var(--surface); color: var(--ink); }
.btn--ghost:hover { background: var(--surface-2); }
.btn--block { width: 100%; }
.btn:disabled { background: var(--surface-2); color: var(--muted); opacity: 1; transform: none; }

/* Home */
.nav { position: sticky; top: 0; z-index: 20; height: 56px; padding: 0 12px 0 20px; display: flex; align-items: center; gap: 8px; background: var(--bg); }
.org { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.org__mark { width: 32px; height: 32px; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; }
.org__name { font-weight: 700; font-size: 16px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { border: 0; background: var(--surface); min-height: 38px; padding: 0 12px; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .2s, transform .15s; }
.chip:hover { background: var(--surface-2); }
.chip:active { transform: scale(.96); }
.iconbtn { border: 0; background: none; width: 40px; height: 40px; display: grid; place-items: center; flex: none; transition: transform .15s; }
.iconbtn:active { transform: scale(.9); }
.iconbtn svg { width: 22px; height: 22px; }

.ticker { background: var(--ink); color: var(--bg); display: flex; align-items: center; height: 44px; overflow: hidden; font-size: 14px; }
.ticker__label { flex: none; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.ticker__viewport { overflow: hidden; flex: 1; min-width: 0; }
.ticker__track { display: flex; width: max-content; animation: marquee 50s linear infinite; }
.ticker__track span { padding: 0 20px; white-space: nowrap; }
.ticker__track b { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; animation: pulse 1.8s ease-in-out infinite; }

.hero__img { position: relative; background: var(--island); }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.slides::-webkit-scrollbar { display: none; }
.slides:focus-visible { outline-offset: -4px; outline-color: var(--accent); }
.slide { flex: 0 0 100%; margin: 0; scroll-snap-align: start; scroll-snap-stop: always; }
.slide img { display: block; width: 100%; aspect-ratio: 5 / 4; object-fit: cover; object-position: 50% 50%; }
.slide img.is-tall { object-position: 50% 12%; }
.slide:first-child img { animation: unveil 1.1s cubic-bezier(.7,0,.2,1) .2s both; }
.gal__count { position: absolute; left: 12px; top: 12px; background: var(--island); color: var(--on-island); font-size: 13px; font-weight: 700; padding: 4px 9px; font-variant-numeric: tabular-nums; pointer-events: none; }
.gal__nav { position: absolute; top: 50%; margin-top: -20px; width: 40px; height: 40px; border: 0; background: var(--bg); color: var(--ink); display: grid; place-items: center; transition: opacity .2s, transform .15s; }
.gal__nav:active { transform: scale(.92); }
.gal__nav:disabled { opacity: 0; pointer-events: none; }
.gal__nav svg { width: 20px; height: 20px; }
.gal__nav--prev { left: 10px; }
.gal__nav--next { right: 10px; }
.dots { position: absolute; left: 12px; bottom: 22px; display: flex; gap: 6px; }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 4px; background: var(--on-island); opacity: .5; transition: width .25s, opacity .25s; }
.dots button[aria-current="true"] { width: 22px; opacity: 1; }
.flyerbtn { position: absolute; right: 12px; bottom: 12px; border: 0; background: var(--bg); color: var(--ink); min-height: 40px; padding: 0 14px; font-size: 14px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; transition: transform .15s; }
.flyerbtn:active { transform: scale(.95); }
.flyerbtn svg { width: 16px; height: 16px; }
.hero__body { padding: 20px 20px 28px; display: grid; gap: 0; }
.hero__when { margin: 0; font-size: 15px; color: var(--muted); }
.hero__title { margin: 10px 0 0; font-size: 40px; font-weight: 800; font-stretch: 125%; line-height: 1; letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
.hero__extra { margin: 8px 0 0; font-size: 20px; font-weight: 600; }
.price { display: flex; align-items: flex-end; gap: 12px; margin: 22px 0 18px; }
.price__bs { margin: 0; font-size: 44px; font-weight: 800; font-stretch: 112%; line-height: .9; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.price__usd { margin: 0; font-size: 14px; line-height: 1.3; color: var(--muted); }
.price__usd b { color: var(--ink); font-weight: 600; }
.live { margin: 14px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.live .dot { color: var(--good); }
.live b { color: var(--ink); font-weight: 600; }

.clock { padding: 8px 20px 0; }
.clock p { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
.cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.cd div { background: var(--ink); color: var(--bg); padding: 12px 0 10px; text-align: center; }
.cd b { display: block; font-size: 32px; font-weight: 800; font-stretch: 112%; line-height: 1; font-variant-numeric: tabular-nums; }
.cd span { font-size: 13px; opacity: .75; }

.sold { padding: 36px 20px 0; display: grid; gap: 10px; }
.sold p { margin: 0; }
.sold__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sold__pct { font-size: 34px; font-weight: 800; font-stretch: 112%; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.sold__pct small { font-size: 17px; font-weight: 600; font-stretch: 100%; letter-spacing: 0; margin-left: 4px; }
.sold__n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 12px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); transition: width .8s ease; }
.sold__left { font-size: 17px; }
.sold__left b { font-weight: 700; }

.h2 { margin: 0; font-size: 28px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; font-stretch: 112%; text-wrap: balance; }
.note { margin: 8px 0 0; font-size: 15px; color: var(--muted); }
.prizes { padding: 56px 20px 0; }
.prizes .h2 { margin-bottom: 18px; }
.p1 { background: var(--ink); color: var(--bg); padding: 18px 18px 20px; display: grid; gap: 4px; }
.p1 small, .p23 small { font-size: 14px; opacity: .75; }
.p1 b { font-size: 26px; font-weight: 800; font-stretch: 112%; line-height: 1.05; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.p1 span { font-size: 17px; font-weight: 600; }
.p23row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
.p23 { background: var(--surface); padding: 14px 14px 16px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.p23 b { font-size: 20px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }

/* ---------- The purchase box: one place, three stages ---------- */
.buy { margin: 56px 0 0; background: var(--surface); padding: 24px 20px 26px; scroll-margin-top: 60px; }
.buy__h { margin: 0 0 16px; font-size: 26px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; font-stretch: 112%; }
.stage { display: grid; gap: 0; }
.stage.is-in { animation: stagein .45s cubic-bezier(.2,.7,.2,1) both; }
.back { border: 0; background: none; padding: 0; margin: -4px 0 12px; display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; min-height: 40px; justify-self: start; text-decoration: underline; text-underline-offset: 3px; }
.back svg { width: 18px; height: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); padding: 4px; }
.seg button { border: 0; background: none; min-height: 46px; font-size: 16px; font-weight: 700; color: var(--muted); transition: background .2s, color .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
.qbtn { position: relative; border: 0; background: var(--bg); padding: 16px 10px 12px; text-align: left; display: grid; gap: 2px; transition: background .2s, color .2s, transform .15s; }
.qbtn:hover { background: var(--surface-2); }
.qbtn:active { transform: scale(.96); }
.qbtn b { font-size: 30px; font-weight: 800; font-stretch: 125%; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.qbtn span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qbtn em { position: absolute; top: 0; right: 0; font-style: normal; font-size: 13px; font-weight: 700; padding: 3px 7px; background: var(--ink); color: var(--bg); }
.qbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.qbtn[aria-pressed="true"] span { color: inherit; opacity: .8; }
.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 6px; margin-top: 6px; }
.stepper button { border: 0; background: var(--bg); font-size: 26px; font-weight: 500; transition: background .2s, transform .15s; }
.stepper button:hover { background: var(--surface-2); }
.stepper button:active { transform: scale(.94); }
.field { width: 100%; min-height: 54px; border: 2px solid var(--surface-2); background: var(--bg); padding: 0 14px; font-size: 18px; border-radius: 0; transition: border-color .2s; appearance: none; min-width: 0; }
.field:focus { border-color: var(--ink); outline: none; }
.stepper .field { text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.field.is-bad { border-color: var(--danger); }
.err { margin: 8px 0 0; color: var(--danger); font-size: 15px; line-height: 1.4; }
.hint { margin: 10px 0 0; font-size: 15px; color: var(--muted); line-height: 1.45; }
.lbl { display: block; margin: 18px 0 8px; font-size: 15px; font-weight: 600; }
.lbl small { font-weight: 400; color: var(--muted); }
.manual { margin-top: 14px; display: grid; gap: 10px; }
.manual .hint { margin: 0; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { display: inline-flex; align-items: center; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; padding-left: 12px; animation: pop .3s cubic-bezier(.2,.8,.3,1.3); }
.chips button { border: 0; background: none; color: inherit; width: 40px; height: 40px; font-size: 20px; }
.go { margin-top: 18px; display: flex; justify-content: space-between; padding: 0 20px; min-height: 64px; }
.go span { font-size: 18px; }
.go b { font-size: 19px; font-variant-numeric: tabular-nums; }
.go__sub { margin: 8px 0 0; text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.recap { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; background: var(--bg); padding: 12px 14px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.recap span { font-size: 15px; color: var(--muted); }
.recap b { font-size: 18px; }
.idrow { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 6px; }
.seg--id { grid-template-columns: repeat(3, 1fr); }
.seg--id button { min-height: 46px; }
.idrow .field { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lookup { min-height: 22px; margin: 10px 0 0; font-size: 15px; display: flex; align-items: center; gap: 8px; color: var(--muted); }
.lookup.is-ok { color: var(--good); font-weight: 600; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
.field.is-filled { animation: fill .6s ease both; }
.methods { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.method { border: 0; background: var(--bg); padding: 14px 12px; text-align: left; display: grid; gap: 4px; align-content: start; min-height: 104px; transition: background .2s, color .2s, transform .15s; }
.method:hover { background: var(--surface-2); }
.method:active { transform: scale(.97); }
.mico { width: 38px; height: 38px; display: grid; place-items: center; background: var(--mc); color: var(--mci); margin-bottom: 6px; }
.mico svg { width: 22px; height: 22px; }
.method b { font-size: 16px; line-height: 1.2; }
.method span { font-size: 13px; color: var(--muted); line-height: 1.35; }
.method em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--good); }
.method[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.method[aria-checked="true"] span { color: inherit; opacity: .8; }
.method[aria-checked="true"] em { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.paybox { margin-top: 12px; background: var(--bg); padding: 6px 14px; }
.paybox table { width: 100%; border-collapse: collapse; font-size: 15px; }
.paybox td { padding: 9px 0; vertical-align: middle; }
.paybox tr + tr td { border-top: 2px solid var(--surface); }
.paybox td:first-child { color: var(--muted); width: 34%; padding-right: 8px; }
.paybox td:nth-child(2) { font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.paybox td:last-child { text-align: right; width: 1%; padding-left: 6px; }
.copy { border: 0; background: var(--surface); min-height: 34px; padding: 0 10px; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .2s; }
.copy:hover { background: var(--surface-2); }
.copy.is-done { background: var(--good); color: var(--good-ink); }
.copyall { width: 100%; margin: 6px 0 8px; border: 0; min-height: 46px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s, color .2s, transform .15s; }
.copyall:active { transform: scale(.98); }
.copyall svg { width: 18px; height: 18px; }
.copyall.is-done { background: var(--good); color: var(--good-ink); }
.paybox__brand { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; font-size: 14px; font-weight: 700; }
.paybox__brand i { width: 12px; height: 12px; background: var(--mc); }
.paybox__how { margin: 0 0 6px; font-size: 14px; line-height: 1.45; color: var(--muted); }
.methods__group { grid-column: 1 / -1; margin: 12px 0 2px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.methods__group:first-child { margin-top: 0; }
.method small { font-size: 12px; font-weight: 700; color: var(--muted); }
.method:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.method:disabled small { color: var(--danger); }

/* Reserved (manual review) and rejected (instant payment not found) */
.st-head { padding: 22px 20px 26px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.st-icon { width: 56px; height: 56px; display: grid; place-items: center; }
.st-icon svg { width: 30px; height: 30px; }
.st-icon--wait { background: var(--wait); color: var(--bg); }
.st-icon--bad { background: var(--danger); color: var(--bg); }
.st-head h1 { margin: 4px 0 0; font-size: 36px; line-height: .95; }
.st-head p { margin: 0; font-size: 17px; line-height: 1.45; }
.st-head p b { font-weight: 700; }
.steps3 { list-style: none; margin: 0 20px; padding: 0; display: grid; gap: 4px; }
.steps3 li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--surface); padding: 12px 14px; font-size: 15px; line-height: 1.4; }
.steps3 li b { display: block; font-size: 16px; }
.steps3 li span { color: var(--muted); }
.steps3 i { width: 28px; height: 28px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 14px; background: var(--bg); color: var(--muted); }
.steps3 li.is-done i { background: var(--good); color: var(--good-ink); }
.steps3 li.is-now { background: var(--ink); color: var(--bg); }
.steps3 li.is-now span { color: inherit; opacity: .8; }
.steps3 li.is-now i { background: var(--wait); color: var(--bg); animation: pulse 1.8s ease-in-out infinite; }
.held { padding: 26px 14px 0; }
.held-note { margin: 22px 20px 0; background: var(--surface); padding: 16px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15px; line-height: 1.45; }
.held-note svg { width: 36px; height: 36px; padding: 7px; background: var(--ink); color: var(--bg); }
.held-note b { display: block; font-size: 16px; }
.held-note span b { display: inline; font-size: inherit; overflow-wrap: anywhere; }
.held-note span > b:first-child { display: block; font-size: 16px; margin-bottom: 2px; }
.held h2 { margin: 0 6px 12px; font-size: 18px; font-weight: 700; }
.held ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.held li { background: var(--surface); padding: 10px 10px 12px; display: grid; gap: 4px; }
.held li b { font-size: 28px; font-weight: 800; font-stretch: 125%; line-height: .9; font-variant-numeric: tabular-nums; color: var(--muted); }
.held li span { font-size: 12px; font-weight: 700; color: var(--wait); }
.why { margin: 0 20px; background: var(--surface); padding: 16px; display: grid; gap: 10px; }
.why h2 { margin: 0; font-size: 17px; font-weight: 700; }
.why ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; line-height: 1.45; }
.why p { margin: 0; font-size: 15px; line-height: 1.45; }
.why--note { background: var(--bg); outline: 2px solid var(--surface-2); outline-offset: -2px; }
.st-body { padding: 22px 20px 60px; display: grid; gap: 14px; }
.st-body > p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
.st-body .order { margin-top: 4px; }
.support { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); padding: 12px 14px; font-size: 15px; }
.support small { display: block; font-size: 13px; color: var(--muted); }
.support b { font-size: 17px; font-variant-numeric: tabular-nums; }
.upload { display: flex; align-items: center; gap: 12px; margin-top: 12px; min-height: 60px; padding: 0 14px; background: var(--bg); cursor: pointer; font-size: 15px; font-weight: 600; transition: background .2s; }
.upload:hover { background: var(--surface-2); }
.upload svg { width: 24px; height: 24px; flex: none; }
.upload small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
/* a loaded receipt shows a green check, the same in every template so it reads at a glance */
:root, .force-light { --ok: #16a34a; --ok-ink: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #22c55e; --ok-ink: #052e16; } }
:root[data-theme="dark"], .force-dark { --ok: #22c55e; --ok-ink: #052e16; }
.upcheck { display: none; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--ok); color: var(--ok-ink); place-items: center; }
.upload .upcheck svg { width: 20px; height: 20px; }
.app .upload.has-file { background: color-mix(in srgb, var(--ok) 13%, var(--bg)); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ok); }
.app .upload.has-file > svg { display: none; }
.app .upload.has-file .upcheck { display: grid; animation: checkIn .45s cubic-bezier(.3, 1.5, .5, 1); }
.app .upload.has-file [data-file-name] { color: var(--ok); font-weight: 800; }
.app .upload.has-file small { color: var(--muted); opacity: 1; }
@keyframes checkIn { from { transform: scale(.3) rotate(-30deg); opacity: 0; } }
input[type="file"]:focus-visible + .upload { outline: 3px solid var(--ink); outline-offset: 2px; }
.upload.is-bad { outline: 2px solid var(--danger); outline-offset: -2px; }
.upload.is-bad small { color: var(--danger); }

/* Number board (manual mode) */
.board-bg { position: absolute; inset: 0; z-index: 54; background: var(--scrim); animation: fadein .25s ease; }
.board { position: absolute; z-index: 55; left: 0; right: 0; bottom: 0; height: calc(100% - 96px); background: var(--bg); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; animation: sheetin .35s cubic-bezier(.2,.8,.2,1); }
.board__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 16px 10px 20px; }
.board__head h2 { margin: 0; font-size: 22px; font-weight: 800; font-stretch: 112%; line-height: 1.1; }
.board__head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.board__x { border: 0; background: var(--surface); width: 40px; height: 40px; font-size: 22px; flex: none; }
.board__tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 0 16px 0 20px; }
.board__tools .field { min-height: 46px; font-size: 16px; }
.rand { display: flex; gap: 4px; }
.rand button { border: 0; background: var(--surface); min-width: 46px; min-height: 46px; font-weight: 700; font-size: 15px; transition: background .2s, transform .15s; }
.rand button:hover { background: var(--surface-2); }
.rand button:active { transform: scale(.94); }
.series { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px 10px 20px; }
.series::-webkit-scrollbar { display: none; }
.series button { flex: none; border: 0; background: var(--surface); min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.series button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.grid { overflow-y: auto; scrollbar-width: none; padding: 2px 16px 12px 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; align-content: start; }
.grid::-webkit-scrollbar { display: none; }
.grid button { border: 0; background: var(--surface); min-height: 44px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; transition: background .15s, color .15s, transform .12s; }
.grid button:hover:not(:disabled) { background: var(--surface-2); }
.grid button:active:not(:disabled) { transform: scale(.94); }
.grid button:disabled { background: none; color: var(--muted); text-decoration: line-through; opacity: .55; }
.grid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.grid__empty { grid-column: 1 / -1; margin: 12px 0; color: var(--muted); font-size: 15px; }
.board__foot { padding: 10px 16px 34px 20px; display: grid; gap: 8px; background: var(--surface); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; display: inline-block; }
.legend .l1 { background: var(--bg); outline: 2px solid var(--surface-2); outline-offset: -2px; }
.legend .l2 { background: var(--muted); opacity: .4; }
.legend .l3 { background: var(--accent); }

/* Rest of the page */
.orgcard { margin: 56px 20px 0; background: var(--surface); padding: 20px; display: grid; gap: 16px; }
.orgcard__who { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center; }
.orgcard__who .org__mark { width: 52px; height: 52px; font-size: 20px; }
.orgcard__who b { display: block; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
.orgcard__who span { font-size: 14px; color: var(--muted); }
.orgcard dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 15px; }
.orgcard dt { color: var(--muted); }
.orgcard dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.seal { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--bg); padding: 12px; font-size: 14px; line-height: 1.4; }
.seal svg { width: 40px; height: 40px; }
.seal b { display: block; font-size: 15px; }
.rank { padding: 56px 20px 0; }
.rank ol { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 4px; }
.rank li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px 12px 12px; background: var(--surface); }
.rank li:first-child { background: var(--accent); color: var(--accent-ink); padding-block: 18px; }
.rank__pos { font-size: 22px; font-weight: 800; font-stretch: 125%; }
.rank__who b { display: block; font-weight: 600; font-size: 16px; }
.rank__who span { font-size: 13px; opacity: .75; }
.rank__n { text-align: right; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.rank__n span { display: block; font-size: 13px; font-weight: 400; opacity: .75; }
.acc-sec { padding: 56px 20px 0; }
.acc-sec .h2 { margin-bottom: 18px; }
.acc { display: grid; gap: 4px; }
.acc__item { background: var(--surface); }
.acc__item button { width: 100%; min-height: 60px; border: 0; background: none; text-align: left; padding: 12px 16px; font-size: 17px; font-weight: 600; line-height: 1.3; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.acc__item button svg { width: 16px; height: 16px; flex: none; transition: transform .3s ease; }
.acc__item button[aria-expanded="true"] svg { transform: rotate(45deg); }
.acc__body { padding: 0 16px 18px; font-size: 16px; line-height: 1.5; }
.acc__body p { margin: 0; }
.steps-list { counter-reset: s; }
.steps-list .acc__item button span::before { counter-increment: s; content: counter(s) ". "; }
.afoot { margin-top: 80px; background: var(--ink); color: var(--bg); padding: 36px 20px 130px; display: grid; gap: 22px; }
.afoot p { margin: 0; font-size: 14px; line-height: 1.5; opacity: .8; }
.afoot .lgmark { font-size: 19px; }
.afoot .lgmark i { width: 22px; height: 22px; }
.afoot__pow { font-size: 15px !important; opacity: 1 !important; }

.buybar { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px 20px; background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 12px; transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.buybar.is-on { transform: none; }
.buybar p { margin: 0 auto 0 0; font-size: 14px; line-height: 1.3; }
.buybar p b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.buybar .btn { min-height: 52px; }

.lightbox { position: absolute; inset: 0; z-index: 60; background: var(--island); display: grid; grid-template-rows: 54px 56px minmax(0, 1fr); }
.lightbox__bar { grid-row: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px 0 20px; color: var(--on-island); font-weight: 600; }
.lightbox__bar button { border: 0; background: var(--on-island); color: var(--island); min-height: 40px; padding: 0 14px; font-weight: 700; font-size: 15px; }
.lightbox__img { grid-row: 3; overflow-y: auto; scrollbar-width: none; padding-bottom: 40px; }
.lightbox__img img { display: block; width: 100%; height: auto; }
.lightbox__img img + img { margin-top: 6px; }

.verify { position: absolute; inset: 54px 0 0; z-index: 58; background: var(--island); color: var(--on-island); padding: 0 24px 80px; display: grid; align-content: center; gap: 18px; }
.verify h2 { margin: 0; font-size: 34px; line-height: 1.02; font-weight: 800; font-stretch: 125%; letter-spacing: -0.02em; }
.verify p { margin: 0; font-size: 17px; opacity: .8; }
.verify p b { opacity: 1; }
.vbar { height: 8px; background: rgba(255, 255, 255, .18); overflow: hidden; margin-top: 10px; }
.vbar span { display: block; height: 100%; width: 40%; background: var(--accent); animation: indet 1.3s ease-in-out infinite; }

/* Success + Mis boletos */
.ok-head { padding: 22px 20px 26px; display: grid; gap: 12px; }
.ok-head h1 { margin: 0; font-size: 68px; }
.ok-head p { margin: 0; font-size: 17px; line-height: 1.45; max-width: 32ch; }
.ok-head p b { font-weight: 700; }
.tkt { position: relative; margin: 0 14px; background: var(--accent); color: var(--accent-ink); }
.tkt::before, .tkt::after { content: ""; position: absolute; top: 150px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); }
.tkt::before { left: -12px; }
.tkt::after { right: -12px; }
.tkt__main { padding: 16px 20px 20px; display: grid; gap: 10px; min-height: 162px; }
.tkt__top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; }
.tkt__prize { margin: 0; font-size: 26px; font-weight: 800; font-stretch: 112%; line-height: 1.05; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.tkt__meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.tkt__meta b { display: block; font-size: 15px; }
.tkt__stub { border-top: 3px dotted currentColor; padding: 16px 20px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: end; }
.tkt__lbl { grid-column: 1 / -1; font-size: 14px; font-weight: 600; }
.num { display: inline-flex; font-size: 72px; font-weight: 800; font-stretch: 125%; line-height: .85; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.num i { font-style: normal; display: inline-block; min-width: .62em; text-align: center; }
.num i.is-set { animation: land .35s cubic-bezier(.2,.8,.3,1.3); }
.barcode { width: 92px; height: 56px; display: block; fill: currentColor; }
.stubs-wrap { padding: 28px 14px 0; }
.stubs-wrap h2 { margin: 0 6px 12px; font-size: 18px; font-weight: 700; }
.stubs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stubs li { background: var(--surface); padding: 10px 10px 12px; }
.stubs .num { font-size: 30px; }
.ok-body { padding: 28px 20px 60px; display: grid; gap: 22px; }
.ok-body > p { margin: 0; font-size: 17px; line-height: 1.5; }
.ok-body > p b { font-weight: 600; overflow-wrap: anywhere; }
.order { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; background: var(--surface); }
.order td { padding: 10px 14px; }
.order tr + tr td { border-top: 2px solid var(--bg); }
.order td:first-child { color: var(--muted); }
.order td:last-child { text-align: right; font-weight: 600; }
.ok-actions { display: grid; gap: 6px; }
.confetti { position: absolute; inset: 0; z-index: 45; pointer-events: none; width: 100%; height: 100%; }
.mine-top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 20px; min-height: 52px; }
.mine-top .back { margin: 0; text-decoration: none; font-size: 17px; }
.mine-top p { margin: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mine-body { padding: 4px 20px 60px; }
.mine-body h2 { margin: 6px 0 0; font-size: 30px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.02em; }
.mine-body > p { margin: 10px 0 20px; font-size: 16px; color: var(--muted); }
.mine-res { margin-top: 26px; display: grid; gap: 10px; }
.mine-who { margin: 0; font-size: 17px; }
.mine-who b { font-weight: 700; }
.ord { background: var(--surface); padding: 14px 14px 16px; display: grid; gap: 10px; }
.ord__head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.ord__head b { font-size: 15px; }
.tag { font-size: 13px; font-weight: 700; padding: 4px 8px; white-space: nowrap; }
.tag--ok { background: var(--good); color: var(--good-ink); }
.tag--wait { background: var(--wait); color: var(--bg); }
.ord ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.ord li { background: var(--bg); padding: 6px 10px; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.ord p { margin: 0; font-size: 14px; color: var(--muted); }

/* Motion */
.rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes stagein { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes sheetin { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fadein { from { opacity: 0; } }
@keyframes unveil { from { clip-path: inset(0 0 100% 0); transform: scale(1.08); } to { clip-path: inset(0 0 0 0); transform: none; } }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes land { from { transform: translateY(-30%); opacity: .2; } }
@keyframes fill { from { background: var(--accent); color: var(--accent-ink); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .ticker__viewport { overflow-x: auto; scrollbar-width: none; }
  .ticker__track, .dot { animation: none !important; }
}
/* ================= Plantilla EXPERIMENTAL =================
   A different arrangement of the same content: the photos fill the screen like stories and advance on
   their own; a sheet rises over them with swipeable figures and sticky tabs (Comprar · Premios · Info);
   prizes stand on a podium; the purchase puts the quantity first. Neutral stone and graphite. */
:root, .force-light {
  --bg: #f2f0eb;
  --surface: #ffffff;
  --surface-2: #e6e3dc;
  --ink: #141414;
  --muted: #5d5b56;
  --font: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f0f0f; --surface: #1b1b1b; --surface-2: #2a2a2a; --ink: #f1efe9; --muted: #a6a39b; }
}
:root[data-theme="dark"], .force-dark { --bg: #0f0f0f; --surface: #1b1b1b; --surface-2: #2a2a2a; --ink: #f1efe9; --muted: #a6a39b; }

.wide, .hero__title, .price__bs, .h2, .buy__h, .p1 b, .p23 b, .cd b, .sold__pct, .num, .tkt__prize, .verify h2,
.mine-body h2, .board__head h2, .qbtn b, .rank__pos, .recap b, .held li b {
  font-family: var(--display); font-stretch: 75%; font-weight: 800; letter-spacing: -0.01em; text-transform: none;
}
.wide { line-height: .92; }
.app .btn { border-radius: 999px; font-weight: 700; }
.chip, .flyerbtn, .copy, .copyall, .series button, .rand button, .tag, .seg, .seg button { border-radius: 999px; }
.org__mark, .board__x, .st-icon { border-radius: 50%; }

/* ---- story hero: photos fill the screen ---- */
.xp .nav { position: absolute; top: 22px; left: 0; right: 0; z-index: 8; height: 50px; background: transparent; color: #ffffff; }
.xp .nav .chip { background: rgba(255,255,255,.18); color: #ffffff; }
.xp .nav .org__mark { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
.xp .hero { position: relative; height: 93%; min-height: 560px; background: #000000; color: #ffffff; overflow: hidden; --ink: #ffffff; --muted: rgba(255,255,255,.78); }
.xp .hero__img { position: absolute; inset: 0; background: #000000; }
.xp .slides, .xp .slide { height: 100%; }
.xp .slide img { height: 100%; aspect-ratio: auto; object-fit: cover; }
.xp .slide img.is-tall { object-position: 50% 18%; }
.xp .slide img { animation: kenburns 12s ease-in-out infinite alternate; }
.xp .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 80%; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.78) 40%, rgba(0,0,0,.95));
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); -webkit-mask-image: linear-gradient(transparent, #000 32%); mask-image: linear-gradient(transparent, #000 32%); }
.xp .hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 150px; z-index: 1; pointer-events: none; background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); }
.xp .gal__nav, .xp .dots, .xp .gal__count { display: none; }
.xp-segs { position: absolute; z-index: 9; top: 12px; left: 16px; right: 16px; display: flex; gap: 4px; }
.xp-segs i { flex: 1; height: 3px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.32); }
.xp-segs b { display: block; height: 100%; background: #ffffff; transform-origin: left; transform: scaleX(0); }
.xp-segs .done b { transform: scaleX(1); }
.xp-segs .now b { animation: seg 5s linear forwards; }
.xp-tap { position: absolute; z-index: 3; top: 80px; bottom: 50%; width: 34%; border: 0; background: transparent; }
.xp-tap--prev { left: 0; }
.xp-tap--next { right: 0; }
.xp .flyerbtn { top: 80px; bottom: auto; right: 14px; z-index: 4; background: rgba(0,0,0,.45); color: #ffffff; }
.xp .hero__body { position: absolute; z-index: 2; left: 0; right: 0; bottom: 40px; padding: 0 20px; }
.xp .hero__when { font-weight: 600; }
.xp .hero__title { font-size: 50px; line-height: .92; }
.xp .hero__extra { font-size: 19px; }
.xp .price { margin: 16px 0 16px; }
.xp .price__bs { font-size: 44px; white-space: nowrap; }
.xp .hero .btn--accent { min-height: 58px; }
.xp .hero .btn--accent::after { content: "↓"; margin-left: 6px; display: inline-block; animation: nudge 1.2s ease-in-out infinite; }
.xp .live .dot { color: var(--accent); }

/* ---- the sheet that rises over the photos ---- */
.xp-sheet { position: relative; z-index: 4; margin-top: -28px; background: var(--bg); border-radius: 30px 30px 0 0; padding-top: 10px; min-height: 70%; }
.xp-grab { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--surface-2); margin: 0 auto 14px; }
.xp .ticker { margin: 0 16px; height: 40px; border-radius: 999px; background: var(--surface); color: var(--ink); }
.xp .ticker__label { background: var(--ink); color: var(--bg); border-radius: 999px; }
.xp-stats { display: grid; gap: 10px; padding: 14px 16px 4px; }
.xp-stats > section { margin: 0; background: var(--surface); border-radius: 24px; padding: 18px 16px !important; }
.xp .clock p { color: var(--muted); }
.xp .cd div { background: var(--surface-2); color: var(--ink); border-radius: 14px; }
.xp .cd b { font-size: 30px; }
.xp .cd b.tick { animation: tickUp .4s cubic-bezier(.2,.8,.3,1.3); }
.xp .cd span { color: var(--muted); opacity: 1; }
.xp .sold__pct { font-size: 40px; }
.xp .bar { height: 10px; border-radius: 999px; }
.xp .bar span { border-radius: 999px; }
.xp-tabs { position: sticky; top: 0; z-index: 12; display: flex; gap: 6px; padding: 14px 16px 12px; background: var(--bg); }
.xp-tabs button { flex: 1; min-height: 46px; border: 0; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 700; transition: background .25s, color .25s, transform .15s; }
.xp-tabs button:active { transform: scale(.96); }
.xp-tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
[data-xp-panel] { animation: panelIn .4s cubic-bezier(.2,.8,.2,1); }

/* ---- Comprar: quantity first ---- */
.xp .buy { margin: 4px 16px 0; padding: 22px 18px 24px; border-radius: 28px; background: var(--surface); }
.xp .buy__h { font-size: 26px; }
.xp .seg { background: var(--surface-2); }
.xp [data-panel="random"] { display: flex; flex-direction: column; }
.xp .stepper { order: -1; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center; margin: 18px 0 4px; }
.xp .stepper button { height: 64px; border-radius: 50%; background: var(--surface-2); font-size: 30px; }
.xp .stepper .field { min-height: 92px; border: 0; background: transparent; font-family: var(--display); font-weight: 800; font-size: 64px; letter-spacing: -0.04em; }
.xp .quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 4px -18px 0; padding: 12px 18px 4px; }
.xp .quick::-webkit-scrollbar { display: none; }
.xp .qbtn { position: relative; flex: 0 0 auto; display: flex; gap: 8px; align-items: baseline; padding: 12px 16px; border-radius: 999px; background: var(--surface-2); }
.xp .qbtn b { font-size: 20px; }
.xp .qbtn em { top: -9px; right: -2px; border-radius: 999px; font-size: 11px; padding: 2px 7px; background: var(--accent); color: var(--accent-ink); }
.xp .qbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.xp .qbtn[aria-pressed="true"] span { color: inherit; }
.xp .field { border-radius: 16px; }
.xp .go { border-radius: 999px; }
.xp .chips li { border-radius: 999px; padding-left: 14px; }
.xp .recap, .xp .method, .xp .paybox, .xp .upload { border-radius: 18px; background: var(--surface-2); }
.xp .method[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.xp .mico { border-radius: 12px; }
.xp .copy { background: var(--surface); }
.xp .stage.is-in { animation: panelIn .45s cubic-bezier(.2,.8,.2,1) both; }

/* ---- Premios: steps of a podium laid on its side ---- */
.xp .prizes { padding: 6px 16px 0; display: grid; gap: 10px; }
.xp .prizes .h2 { font-size: 28px; margin-bottom: 4px; }
.xp .p23row { display: contents; }
.xp .p1, .xp .p23 { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-content: center; padding: 16px 18px 16px 14px; border-radius: 8px 26px 26px 8px; transform-origin: left; }
.xp .p1 > *, .xp .p23 > * { grid-column: 2; }
.xp .p1::before, .xp .p23::before { grid-column: 1; grid-row: 1 / span 3; align-self: center; font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; text-align: center; }
.xp .p1 { width: 100%; min-height: 128px; background: var(--accent); color: var(--accent-ink); }
.xp .p23:nth-child(1) { width: 88%; min-height: 96px; background: var(--surface); }
.xp .p23:nth-child(2) { width: 76%; min-height: 84px; background: var(--surface-2); }
.xp .p1::before { content: "1"; }
.xp .p23:nth-child(1)::before { content: "2"; }
.xp .p23:nth-child(2)::before { content: "3"; }
.xp .p1 b { font-size: 26px; line-height: 1.02; overflow-wrap: break-word; }
.xp .p1 span { font-size: 15px; }
.xp .p23 b { font-size: 19px; line-height: 1.1; overflow-wrap: break-word; }
.xp .p1 small, .xp .p23 small { font-size: 12px; }
.xp .prizes.is-seen .p1, .xp .prizes.is-seen .p23 { animation: stepIn .8s cubic-bezier(.2,.8,.2,1) both; }
.xp .prizes.is-seen .p23:nth-child(1) { animation-delay: .12s; }
.xp .prizes.is-seen .p23:nth-child(2) { animation-delay: .24s; }
@keyframes stepIn { from { transform: scaleX(.35); opacity: 0; } to { transform: none; opacity: 1; } }
.xp .rank { padding: 34px 16px 0; }
.xp .rank li { border-radius: 18px; }
.xp .rank__pos { font-size: 22px; }

/* ---- Info ---- */
.xp .orgcard { margin: 6px 16px 0; border-radius: 24px; }
.xp .seal { border-radius: 16px; }
.xp .acc-sec { padding: 34px 16px 0; }
.xp .acc__item { border-radius: 18px; overflow: hidden; }
.xp .afoot { margin-top: 60px; border-radius: 30px 30px 0 0; }
.xp .buybar { left: 10px; right: 10px; bottom: 26px; padding: 10px 10px 10px 22px; border-radius: 999px; transform: translateY(170%); }
.xp .buybar.is-on { transform: none; }

/* ---- results ---- */
.ok-head { background: var(--ink); color: var(--bg); border-radius: 0 0 34px 34px; padding-bottom: 70px; }
.ok-head h1 { font-size: 82px; }
.tkt { margin-top: -48px; border-radius: 24px; }
.tkt__prize { font-size: 24px; }
.num { font-size: 66px; letter-spacing: -0.02em; }
.num i { min-width: .62em; }
.st-head h1 { font-size: 42px; }
.stubs li, .order, .steps3 li, .held li, .why, .support, .held-note, .ord { border-radius: 18px; }
.order { border-collapse: separate; border-spacing: 0; overflow: hidden; }
.board { border-radius: 28px 28px 0 0; }
.grid button { border-radius: 12px; }

/* motion */
.rise { animation: xpRise .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes xpRise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes panelIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes seg { to { transform: scaleX(1); } }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08); } }
@keyframes nudge { 50% { transform: translateY(4px); } }
@keyframes tickUp { from { transform: translateY(40%); opacity: .2; } }
/* while a phone is off screen only the endless loops pause; entrances always finish */
.fx-paused .slide img, .fx-paused .xp-segs b, .fx-paused .ticker__track, .fx-paused .hero .btn--accent::after, .fx-paused .dot { animation-play-state: paused !important; }

/* keep the scrolling pill row from widening the buy box */
.xp .stage > *, .xp [data-panel="random"] > * { min-width: 0; }

/* ================= Computer =================
   The same page laid out for a wide screen. The app gets the class "desk" on a computer (the Mac frames in this
   showcase, or a real window 900px or wider that isn't a phone); phones keep the layout above.
   Photos and the price share the first screen, and the purchase box stays in view beside the prizes.
   :where() keeps these rules light, so each template can restyle them with ".desk ..." below. */
.desk { --side: max(32px, calc((100% - 1180px) / 2)); }
:where(.desk) .island, :where(.desk) .sbar, :where(.desk) .homebar { display: none; }
:where(.desk) .scroller { inset: 0; }
:where(.desk) .nav { height: 72px; gap: 12px; padding: 0 var(--side); }
:where(.desk) .org { margin-right: 0; }
:where(.desk) .org__mark { width: 38px; height: 38px; font-size: 15px; }
:where(.desk) .org__name { font-size: 18px; }
:where(.desk) .nav .nav__links { display: flex; gap: 2px; margin: 0 auto 0 24px; }
:where(.desk) .nav .nav__buy { display: inline-flex; min-height: 46px; padding: 0 22px; font-size: 15px; }
:where(.desk) .ticker__label { padding-left: var(--side); }

/* home: photos left and the prize, price, countdown and sales right; then prizes left and the purchase box right */
:where(.desk:not(.own-layout)) .page {
  position: relative; isolation: isolate; display: grid; align-items: start;
  grid-template-columns: [full-start] var(--side) [l-start] minmax(0, 1fr) [l-end] 64px [r-start] minmax(0, 448px) [r-end] var(--side) [full-end];
}
:where(.desk:not(.own-layout)) .page > * { grid-column: l; }
:where(.desk:not(.own-layout)) .hero { display: contents; }
:where(.desk:not(.own-layout)) .hero__img { grid-column: l; grid-row: 1 / span 3; margin: 40px 0 0; }
:where(.desk:not(.own-layout)) .hero__body { grid-column: r; grid-row: 1; padding: 40px 0 0; }
:where(.desk:not(.own-layout)) .hero__title { font-size: 52px; }
:where(.desk:not(.own-layout)) .price__bs { font-size: 56px; }
:where(.desk:not(.own-layout)) .clock { grid-column: r; grid-row: 2; padding: 30px 0 0; }
:where(.desk:not(.own-layout)) .sold { grid-column: r; grid-row: 3; padding: 26px 0 0; }
:where(.desk:not(.own-layout)) .prizes { grid-row: 6; padding: 80px 0 0; }
:where(.desk:not(.own-layout)) .buy { grid-column: r; grid-row: 6 / span 5; position: sticky; top: var(--buy-top, 96px); margin: 80px 0 0; scroll-margin-top: 96px; }
:where(.desk:not(.own-layout)) .orgcard { grid-row: 7; margin: 56px 0 0; }
:where(.desk:not(.own-layout)) .rank { grid-row: 8; padding: 56px 0 0; }
:where(.desk:not(.own-layout)) [data-sec="how"] { grid-row: 9; padding: 56px 0 0; }
:where(.desk:not(.own-layout)) [data-sec="faq"] { grid-row: 10; padding: 56px 0 0; }
:where(.desk) .h2 { font-size: 34px; }
:where(.desk) .afoot { margin-top: 96px; padding: 56px var(--side) 64px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 64px; align-items: start; }
:where(.desk) .afoot > * { grid-column: 1; }
:where(.desk) .afoot > p:nth-of-type(2) { grid-column: 2; grid-row: 1; }
:where(.desk) .afoot > p:nth-of-type(3) { grid-column: 2; grid-row: 2; }
:where(.desk) .buybar { left: auto; right: var(--side); bottom: 24px; width: 460px; padding: 12px 12px 12px 22px; transform: translateY(160%); }
:where(.desk) .buybar.is-on { transform: none; }

/* number board, photos and payment check open in the middle of the window */
:where(.desk) .board { left: 50%; right: auto; top: 50%; bottom: auto; width: min(880px, calc(100% - 64px)); height: min(720px, calc(100% - 64px)); transform: translate(-50%, -50%); animation: deskIn .3s cubic-bezier(.2,.8,.2,1); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
:where(.desk) .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); }
:where(.desk) .board__foot { padding: 14px 20px 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); align-items: center; }
:where(.desk) .lightbox { grid-template-rows: 0 72px minmax(0, 1fr); }
:where(.desk) .lightbox__bar { padding: 0 var(--side); }
:where(.desk) .lightbox__img { padding: 0 max(32px, calc((100% - 960px) / 2)) 48px; }
:where(.desk) .verify { inset: 0; padding: 0 max(32px, calc((100% - 600px) / 2)) 40px; }
:where(.desk) .verify h2 { font-size: 52px; }

/* after paying: the answer and the tickets left, the order and what comes next right */
:where(.desk) [data-ok-scroller], :where(.desk) [data-held-scroller], :where(.desk) [data-rej-scroller] {
  display: grid; align-content: start; align-items: start;
  grid-template-columns: [full-start] var(--side) [l-start] minmax(0, 1fr) [l-end] 72px [r-start] minmax(0, 440px) [r-end] var(--side) [full-end];
}
:where(.desk) [data-ok-scroller] > *, :where(.desk) [data-held-scroller] > *, :where(.desk) [data-rej-scroller] > * { grid-column: l; }
:where(.desk) .ok-head, :where(.desk) .st-head { grid-row: 1; padding: 72px 0 32px; }
:where(.desk) .ok-head h1 { font-size: 104px; }
:where(.desk) .ok-head p, :where(.desk) .st-head p { font-size: 19px; max-width: 40ch; }
:where(.desk) .st-head h1 { font-size: 60px; }
:where(.desk) .tkt { grid-row: 2; margin: 0; }

     (GET /api/v1/payment-methods/active?companyId=…): LOTTOGE_PAGOS.fromApi() convierte cada uno.
   - Cada método solo necesita id, name e icon, más los datos de su cuenta (accountInfo).

window.LOTTOGE_PAGOS = (() => {
  const S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';

  /* Iconos de 24 × 24 en un solo color (currentColor). Son dibujos propios, no logos oficiales:

  const ICONS = {
    'pago-movil': { name: 'Pago Móvil', color: '#0f9d58', ink: '#ffffff', kind: 'banco-ve',
      glyph: `<rect x="6" y="2" width="12" height="20" rx="2.5" ${S}/><path d="M10.5 18.5h3" ${S}/><path d="m9.2 10.4 2 2 3.8-4.2" ${S}/>` },
    'comprobante': { name: 'Pago con comprobante', color: '#1d5fbf', ink: '#ffffff', kind: 'banco-ve',

    'transferencia': { name: 'Transferencia bancaria', color: '#24408e', ink: '#ffffff', kind: 'banco-ve',
      glyph: `<path d="M3.5 9.5 12 4.5l8.5 5" ${S}/><path d="M5.5 10.5v7M9.8 10.5v7M14.2 10.5v7M18.5 10.5v7M3.5 20.5h17" ${S}/>` },
    'transferencia-inmediata': { name: 'Transferencia inmediata', color: '#0b7a75', ink: '#ffffff', kind: 'banco-ve',
      glyph: `<path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5" ${S}/>` },
    'tarjeta': { name: 'Tarjeta de débito o crédito', color: '#334155', ink: '#ffffff', kind: 'pasarela',
      glyph: `<rect x="3" y="5" width="18" height="14" rx="2.5" ${S}/><path d="M3 10h18M7 15h4" ${S}/>` },
    'qr': { name: 'Pago con QR', color: '#111827', ink: '#ffffff', kind: 'pasarela',
      glyph: `<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z" ${S}/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 18h2.5v2H14zM18 14h2v2.5h-2z" ${F}/>` },
    'zelle': { name: 'Zelle', color: '#6d1ed4', ink: '#ffffff', kind: 'usd',
      glyph: `<path d="M6 5h12v2.9L9.9 16.4H18V19H6v-2.9l8.1-8.5H6z" ${F}/><path d="M11 2h2v3h-2zM11 19h2v3h-2z" ${F}/>` },
    'binance': { name: 'Binance Pay', color: '#f0b90b', ink: '#1e2026', kind: 'cripto',
      glyph: `<path d="m12 2.6 3.4 3.4L12 9.4 8.6 6zM6 8.6 9.4 12 6 15.4 2.6 12zm12 0 3.4 3.4-3.4 3.4-3.4-3.4zm-6 6 3.4 3.4-3.4 3.4-3.4-3.4z" ${F}/>` },
    'usdt': { name: 'USDT', color: '#26a17b', ink: '#ffffff', kind: 'cripto',
      glyph: `<circle cx="12" cy="12" r="9" ${S}/><path d="M8 8h8M12 8v9" ${S}/><path d="M8.3 11.6c1 .6 2.3.9 3.7.9s2.7-.3 3.7-.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>` },
    'cripto': { name: 'Criptomonedas', color: '#f7931a', ink: '#1a1206', kind: 'cripto',
      glyph: `<path d="M12 2.5 20.2 7v10L12 21.5 3.8 17V7z" ${S}/><path d="M12 7.6 15.8 9.8v4.4L12 16.4l-3.8-2.2V9.8z" ${F}/>` },
    'paypal': { name: 'PayPal', color: '#003087', ink: '#ffffff', kind: 'usd',
      glyph: `<path fill-rule="evenodd" d="M7 3h6.2a5 5 0 0 1 0 10h-2.7v8H7zm3.5 3.2v3.6h2.6a1.8 1.8 0 0 0 0-3.6z" ${F}/>` },
    'zinli': { name: 'Zinli', color: '#7b3fe4', ink: '#ffffff', kind: 'usd',
      glyph: `<rect x="3" y="5" width="18" height="14" rx="3" ${S}/><path d="M8.5 9h7l-7 6h7" ${S}/>` },
    'wally': { name: 'Wally', color: '#00a19a', ink: '#ffffff', kind: 'usd',
      glyph: `<path d="M3.5 6h2.6l2.1 8.2L10.6 6h2.8l2.4 8.2L17.9 6h2.6L17 18h-2.6L12 10l-2.4 8H7z" ${F}/>` },
    'airtm': { name: 'AirTM', color: '#1f6feb', ink: '#ffffff', kind: 'usd',
      glyph: `<path fill-rule="evenodd" d="M12 4 20 20h-3.3l-1.6-3.4H8.9L7.3 20H4zm0 6.2-2 4.2h4z" ${F}/>` },
    'billetera': { name: 'Billetera digital', color: '#475569', ink: '#ffffff', kind: 'usd',
      glyph: `<path d="M4.5 8V7A2.5 2.5 0 0 1 7 4.5h10.5V8" ${S}/><rect x="3.5" y="8" width="17" height="11.5" rx="2.5" ${S}/><circle cx="16" cy="13.75" r="1.5" ${F}/>` },
    'nequi': { name: 'Nequi', color: '#da0081', ink: '#ffffff', kind: 'exterior',
      glyph: `<path d="M6 19V5h2.6l6.8 9.2V5H18v14h-2.6L8.6 9.8V19z" ${F}/>` },
    'daviplata': { name: 'DaviPlata', color: '#e1251b', ink: '#ffffff', kind: 'exterior',
      glyph: `<path fill-rule="evenodd" d="M6 4h5.5a8 8 0 0 1 0 16H6zm3 3v10h2.5a5 5 0 0 0 0-10z" ${F}/>` },
    'yape': { name: 'Yape', color: '#742284', ink: '#ffffff', kind: 'exterior',
      glyph: `<path d="M5 4h3.3L12 10.4 15.7 4H19l-5.5 9v7h-3v-7z" ${F}/>` }
  };

  /* Qué se le pide al comprador según el tipo de icono. Un método puede cambiar cualquiera de estos datos. */
  const REF = {
    banco: { label: 'Número de referencia', placeholder: 'Últimos 6 dígitos', error: 'la referencia', numeric: true },
    zelle: { label: 'Código de confirmación', placeholder: 'Ej. ZL7Q2K', error: 'el código de confirmación', numeric: false },
    binance: { label: 'ID de la orden en Binance', placeholder: 'Ej. 2849104772', error: 'el ID de la orden', numeric: true },
    hash: { label: 'Hash de la transacción (TxID)', placeholder: 'Pega aquí el TxID', error: 'el hash de la transacción', numeric: false },
    paypal: { label: 'ID de la transacción', placeholder: 'Ej. 7XK21934LM881', error: 'el ID de la transacción', numeric: false },
    operacion: { label: 'Número de operación', placeholder: 'Ej. 48211904', error: 'el número de operación', numeric: false },
    comprobante: { label: 'Número de comprobante', placeholder: 'Ej. M1234567', error: 'el número de comprobante', numeric: false },
    autorizacion: { label: 'Número de autorización', placeholder: 'Ej. 004821', error: 'el número de autorización', numeric: true }
  };
  const DEFAULTS = {
    'pago-movil': { currency: 'VES', ref: REF.banco }, 'comprobante': { currency: 'VES', ref: REF.banco },
    'transferencia': { currency: 'VES', ref: REF.banco }, 'transferencia-inmediata': { currency: 'VES', ref: REF.banco },
    'tarjeta': { currency: 'VES', ref: REF.autorizacion }, 'qr': { currency: 'VES', ref: REF.autorizacion },
    'zelle': { currency: 'USD', ref: REF.zelle }, 'binance': { currency: 'USDT', ref: REF.binance },
    'usdt': { currency: 'USDT', ref: REF.hash }, 'cripto': { currency: 'USDT', ref: REF.hash },
    'paypal': { currency: 'USD', ref: REF.paypal }, 'zinli': { currency: 'USD', ref: REF.operacion },
    'wally': { currency: 'USD', ref: REF.operacion }, 'airtm': { currency: 'USD', ref: REF.operacion },
    'billetera': { currency: 'USD', ref: REF.operacion }, 'nequi': { currency: 'COP', ref: REF.comprobante },
    'daviplata': { currency: 'COP', ref: REF.comprobante }, 'yape': { currency: 'PEN', ref: REF.operacion }
  };

  /* Monedas. El monto en Bs es la base; los demás salen de la tasa BCV (Bs por $) y, fuera del dólar,
     de config.js → fx (unidades de esa moneda por 1 $). group: cómo se agrupan los métodos en la página. */
  const CURRENCIES = {
    VES: { name: 'Bolívares', prefix: 'Bs ', suffix: '', decimals: 2, group: 'bs' },
    USD: { name: 'Dólares', prefix: '$', suffix: '', decimals: 2, group: 'usd' },
    USDT: { name: 'Tether (USDT)', prefix: '', suffix: ' USDT', decimals: 2, group: 'usd' },
    EUR: { name: 'Euros', prefix: '€', suffix: '', decimals: 2, group: 'usd' },
    COP: { name: 'Pesos colombianos', prefix: 'COP ', suffix: '', decimals: 0, group: 'ext' },
    PEN: { name: 'Soles', prefix: 'S/ ', suffix: '', decimals: 2, group: 'ext' },
    CLP: { name: 'Pesos chilenos', prefix: 'CLP ', suffix: '', decimals: 0, group: 'ext' },
    BRL: { name: 'Reales', prefix: 'R$ ', suffix: '', decimals: 2, group: 'ext' },
    MXN: { name: 'Pesos mexicanos', prefix: 'MX$ ', suffix: '', decimals: 2, group: 'ext' },
    ARS: { name: 'Pesos argentinos', prefix: 'ARS ', suffix: '', decimals: 0, group: 'ext' }
  };
  const GROUPS = [['bs', 'En bolívares'], ['usd', 'En dólares y cripto'], ['ext', 'Desde otros países']];

  /* Bancos de Venezuela con su código, para "Tu banco" en Pago Móvil y transferencias. */
  const BANCOS_VE = [
    ['0102', 'Banco de Venezuela'], ['0104', 'Venezolano de Crédito'], ['0105', 'Mercantil'], ['0108', 'BBVA Provincial'],
    ['0114', 'Bancaribe'], ['0115', 'Banco Exterior'], ['0128', 'Banco Caroní'], ['0134', 'Banesco'], ['0137', 'Sofitasa'],
    ['0138', 'Banco Plaza'], ['0146', 'Bangente'], ['0151', 'BFC Banco Fondo Común'], ['0156', '100% Banco'], ['0157', 'DelSur'],
    ['0163', 'Banco del Tesoro'], ['0166', 'Banco Agrícola de Venezuela'], ['0168', 'Bancrecer'], ['0169', 'R4 Banco Microfinanciero'],
    ['0171', 'Banco Activo'], ['0172', 'Bancamiga'], ['0174', 'Banplus'], ['0175', 'Banco Bicentenario'], ['0177', 'Banfanb'],
    ['0178', 'N58 Banco Digital'], ['0191', 'BNC Nacional de Crédito']
  ].map(([code, name]) => ({ code, name }));

  /* Si un método no trae icono, se adivina por su nombre. */
  const GUESS = [
    [/pago\s*m[oó]vil/i, 'pago-movil'], [/zelle/i, 'zelle'], [/binance/i, 'binance'], [/usdt|tether/i, 'usdt'],
    [/bitcoin|btc|cripto|eth/i, 'cripto'], [/paypal/i, 'paypal'], [/zinli/i, 'zinli'], [/wally/i, 'wally'], [/airtm/i, 'airtm'],
    [/nequi/i, 'nequi'], [/davi\s*plata/i, 'daviplata'], [/yape/i, 'yape'], [/transfer/i, 'transferencia'],
    [/tarjeta|d[eé]bito|cr[eé]dito|punto/i, 'tarjeta'], [/\bqr\b/i, 'qr']
  ];
  const guessIcon = name => (GUESS.find(([re]) => re.test(name || '')) || [, 'billetera'])[1];

  /* accountInfo puede venir como lista [['Banco', 'Banesco'], …], como lista de { label, value },
     como objeto { Banco: 'Banesco', … } o como texto con una línea "Etiqueta: valor" por dato. */
  const rowsOf = info => {
    if (!info) return [];
    if (Array.isArray(info)) return info.map(r => Array.isArray(r) ? [String(r[0]), String(r[1])] : [String(r.label ?? r.key ?? 'Dato'), String(r.value ?? '')]);
    if (typeof info === 'object') return Object.entries(info).map(([k, v]) => [k, String(v)]);
    return String(info).split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf(':'); return i > 0 ? [l.slice(0, i).trim(), l.slice(i + 1).trim()] : ['Dato', l]; });
  };

  /* Completa un método con los valores de su icono. Es lo que usa la página para todo. */
  function normalize(raw, i = 0) {
    const icon = ICONS[raw.icon] ? raw.icon : guessIcon(raw.name);
    const base = ICONS[icon], def = DEFAULTS[icon];
    const isOnline = !!raw.isOnline, bankVE = base.kind === 'banco-ve';
    const cur = String(raw.currency || def.currency).toUpperCase();
    return {
      id: String(raw.id ?? `metodo-${i + 1}`),
      icon, name: raw.name || base.name,
      note: raw.note ?? (isOnline ? 'Se verifica solo con el banco' : ''),
      badge: raw.badge ?? (isOnline ? 'Al instante' : ''),
      color: raw.color || base.color, ink: raw.colorInk || raw.ink || base.ink,
      currency: CURRENCIES[cur] ? cur : 'USD',
      isOnline, requireReceipt: raw.requireReceipt ?? !isOnline,
      minTickets: Math.max(1, parseInt(raw.minTickets, 10) || 1),
      commissionRate: Math.max(0, +raw.commissionRate || 0),
      accountInfo: rowsOf(raw.accountInfo),
      instructions: raw.instructions || '',
      askPayer: raw.askPayer ?? (isOnline && bankVE),
      askBank: raw.askBank ?? bankVE,
      ref: Object.assign({}, def.ref, raw.ref)
    };
  }

  /* Un método tal como lo devuelve el API real de LottoGE (payment-methods/active):
     { id, name, accountInfo, requireReceipt, isOnline, minTickets, currencyId, commissionRate, countryFlag, instructions }.
     icon y color son opcionales: conviene guardarlos en la base de datos junto a cada método.
     currencyId: si el API usa ids propios en vez de códigos (VES, USD…), se traducen en CURRENCY_IDS. */
  const CURRENCY_IDS = {};
  function fromApi(a, i) {
    const cur = a.currency || CURRENCY_IDS[a.currencyId] || (typeof a.currencyId === 'string' && /^[A-Za-z]{3,4}$/.test(a.currencyId) ? a.currencyId : undefined);
    return normalize({
      id: a.id, name: a.name, icon: a.icon, color: a.color, colorInk: a.colorInk, note: a.note, badge: a.badge,
      isOnline: a.isOnline, requireReceipt: a.requireReceipt, minTickets: a.minTickets, commissionRate: a.commissionRate,
      currency: cur, accountInfo: a.accountInfo, instructions: a.instructions
    }, i);
  }

  /* El icono como SVG. style: 'glyph' (solo el dibujo), 'tile' (ficha cuadrada con su color),
     'circle' (círculo con su color) u 'outline' (borde y dibujo en su color, fondo transparente). */
  function svg(key, style = 'glyph', size = 24, color, ink) {
    const ic = ICONS[key] || ICONS.billetera, c = color || ic.color, k = ink || ic.ink;
    if (style === 'glyph') return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${ic.glyph}</svg>`;
    const bg = style === 'circle' ? `<circle cx="24" cy="24" r="24" fill="${c}"/>`
      : style === 'outline' ? `<rect x="1.5" y="1.5" width="45" height="45" rx="12.5" fill="none" stroke="${c}" stroke-width="3"/>`
      : `<rect width="48" height="48" rx="14" fill="${c}"/>`;
    return `<svg viewBox="0 0 48 48" width="${size}" height="${size}" aria-hidden="true">${bg}<g transform="translate(12 12)" color="${style === 'outline' ? c : k}">${ic.glyph}</g></svg>`;
  }

  const groupOf = code => (CURRENCIES[code] || CURRENCIES.USD).group;
  return { ICONS, DEFAULTS, REF, CURRENCIES, GROUPS, BANCOS_VE, CURRENCY_IDS, normalize, fromApi, guessIcon, rowsOf, svg, groupOf };
})();
</script>
<script>
/* Plantilla Experimental: reordena la página común (historia de fotos, hoja con pestañas).
   venta.js llama a fx(app, ayudas) cada vez que monta la página, después de dibujarla.
   accent: color del rifero que usa la plantilla si config.js no trae uno. */
window.LOTTOGE_TEMA = {
  fx(app, { CFG, D, num, esc, reduce }) {
    const el = app.el, $ = q => el.querySelector(q), $$ = q => [...el.querySelectorAll(q)];
    el.classList.add('xp', 'own-layout'); // lays the page out itself, on phones and on computers
    const hero = $('.hero'), slides = $$('.slide'), n = slides.length;
